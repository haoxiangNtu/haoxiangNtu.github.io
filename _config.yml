# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # Currently available options are "default", "air"
title                    : "Haoxiang Li | Academic Portfolio"
title_separator          : "-"
name                     : &name "Haoxiang Li"
description              : &description "Academic portfolio of Haoxiang Li – PhD Candidate in 3D Material Design & Physics-based Simulation, focusing on Nonlinear Optimization, Multi-Material Distribution, and AI-Driven Simulation"
url                      : https://haoxiangNtu.github.io # 替换为你的 GitHub Pages 链接（如：https://haoxiangli.github.io）
baseurl                  : "" # 无需修改（仓库名为 [用户名].github.io 时）
repository               : "haoxiangNtu/haoxiangNtu.github.io" # 替换为你的仓库地址（如：haoxiangli/haoxiangli.github.io）

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "/images/haoxiang.png" # 若有个人头像，放入 /images/ 目录后替换文件名（无则保留默认）
  name             : "Haoxiang Li"
  pronouns         : # 可选：如 "he/him"
  bio              : "PhD Candidate in 3D Material Design & Physics-based Simulation at Nanyang Technological University (NTU), Singapore. Research interests include gradient-based nonlinear optimization, multi-material distribution design, physics-informed neural networks (PINNs), and GPU-accelerated simulation."
  location         : "Singapore"
  employer         : "Nanyang Technological University (NTU)"
  uri              : # 可选：个人官网链接（无则留空）
  email            : "Haoxiang002@e.ntu.edu.sg"

  # Academic websites
  academia         : # 可选：Academia.edu 链接（无则留空）
  arxiv            : # 可选：arXiv 个人主页链接（无则留空）
  googlescholar    : "https://scholar.google.com/citations?user=[YOUR_GOOGLE_SCHOLAR_ID]" # 替换为你的 Google Scholar 链接（从 Scholar 主页复制）
  inspire-hep      : # 可选：Inspire-HEP 链接（无则留空）
  impactstory      : # 可选：ImpactStory 链接（无则留空）
  orcid            : # 可选：ORCID 链接（如 https://orcid.org/0000-0002-XXX-XXXX，无则留空）
  semantic         : # 可选：Semantic Scholar 链接（无则留空）
  pubmed           : # 留空（你的研究领域无需 PubMed）
  researchgate     : # 可选：ResearchGate 链接（无则留空）
  scopus           : # 可选：Scopus 链接（无则留空）

  # Repositories and software development
  bitbucket        : # 可选：Bitbucket 用户名（无则留空）
  codepen          : # 可选：Codepen 用户名（无则留空）
  dribbble         : # 可选：Dribbble 用户名（无则留空）
  github           : "haoxiangNtu" # 替换为你的 GitHub 用户名（如 haoxiangli）
  kaggle           : # 可选：Kaggle 用户名（无则留空）
  stackoverflow    : # 可选：Stack Overflow 用户ID（无则留空）

  # Social media
  artstation       : # 可选：ArtStation 用户名（无则留空）
  bluesky          : # 可选：Bluesky 用户名（无则留空）
  facebook         : # 可选：Facebook 用户名（无则留空）
  flickr           : # 可选：Flickr 用户名（无则留空）
  foursquare       : # 可选：Foursquare 用户名（无则留空）
  goodreads        : # 可选：Goodreads 用户名（无则留空）
  google_plus      : # 留空（已停用）
  keybase          : # 可选：Keybase 用户名（无则留空）
  instagram        : # 可选：Instagram 用户名（无则留空）
  lastfm           : # 可选：Last.fm 用户名（无则留空）
  linkedin         : "[YOUR_LINKEDIN_USERNAME]" # 替换为你的 LinkedIn 用户名（如 haoxiang-li-xxx）
  mastodon         : # 可选：Mastodon 链接（无则留空）
  medium           : # 可选：Medium 用户名（无则留空）
  pinterest        : # 可选：Pinterest 用户名（无则留空）
  soundcloud       : # 可选：SoundCloud 用户名（无则留空）
  steam            : # 可选：Steam 用户名（无则留空）
  telegram         : # 可选：Telegram 链接（无则留空）
  tumblr           : # 可选：Tumblr 用户名（无则留空）
  twitter          : # 可选：X/Twitter 用户名（无则留空）
  vine             : # 留空（已停用）
  weibo            : # 可选：微博用户名（无则留空）
  wikipedia        : # 可选：Wikipedia 用户名（无则留空）
  xing             : # 可选：Xing 用户名（无则留空）
  youtube          : # 可选：YouTube 用户名（无则留空）
  zhihu            : # 可选：知乎用户名（无则留空）

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    # 你的核心出版物类型（CAD、CMAME 等均为期刊）
  conferences:
    title: 'Conference & Seminar Papers' # 补充 Dagstuhl Seminar 这类会议相关成果

# Site Settings
teaser                   : "teaser.jpg" # 可选：放入 /images/ 目录的预览图（用于社交分享，无则留空）
breadcrumbs              : true # 启用面包屑导航（方便访客浏览）
words_per_minute         : 160
future                   : true
read_more                : "disabled" # 无需启用（学术内容无需摘要跳转）
talkmap_link             : false      # 无需启用（无大量线下演讲地图需求）
comments:
  provider               : false # 关闭评论功能（学术主页无需公开评论）
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "main" # 改为 main 分支（GitHub 默认分支名）
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false     # 保留 RSS 订阅功能（方便学术关注者订阅）
  path                   :

# SEO Related
google_site_verification : # 可选：Google 站点验证代码（无则留空）
bing_site_verification   : # 可选：Bing 站点验证代码（无则留空）
alexa_site_verification  : # 可选：Alexa 站点验证代码（无则留空）
yandex_site_verification : # 可选：Yandex 站点验证代码（无则留空）

# Social Sharing
twitter:
  username               : &twitter # 可选：X/Twitter 用户名（无则留空）
facebook:
  username               : # 可选：Facebook 用户名（无则留空）
  app_id                 :
  publisher              :
og_image                 : "og-image.jpg" # 可选：放入 /images/ 目录的社交分享图（无则留空）
og_description           : *description # 复用站点描述（社交分享时显示）
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : "Person" # 固定为 Person（个人学术主页）
  name                   : *name # 复用姓名
  links: # 仅保留已填写的社交/学术链接（示例如下，需替换为你的实际链接）
    - "https://github.com/[YOUR_GITHUB_USERNAME]"
    - "https://linkedin.com/in/[YOUR_LINKEDIN_USERNAME]"
    - "https://scholar.google.com/citations?user=[YOUR_GOOGLE_SCHOLAR_ID]"

# Analytics
analytics:
  provider               : false # 关闭分析（学术主页无需统计流量，如需启用可改为 "google" 并填写 tracking_id）
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# These settings control the types of collections used by the template
collections:
  teaching:
    output: false # 关闭教学板块（你的简历无教学经历）
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/ # 可用于展示 3D 材料设计案例、项目成果
  talks:
    output: true
    permalink: /:collection/:path/ # 可用于展示 Dagstuhl Seminar 等演讲

# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Singapore # 改为新加坡时区（与你的所在地一致）

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
